<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --space-950: #0A0A18;
    --space-900: #12122A;
    --panel: rgba(18, 18, 42, 0.55);
    --hairline: rgba(245, 240, 255, 0.14);
    --star-white: #F5F0FF;
    --text-dim: #9C97C4;
    --accent-gold: #F2C879;
    --accent-rose: #E85C8A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--space-950);
    font-family: 'Space Grotesk', sans-serif;
  }

  canvas {
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding: clamp(18px, 3vw, 32px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .intro {
    max-width: 320px;
  }

  .intro h1 {
    color: var(--star-white);
    font-size: clamp(18px, 2.4vw, 22px);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .intro p {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
  }

  .hud {
    pointer-events: auto;
    align-self: flex-end;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 10px 14px;
  }

  .hud .stat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--star-white);
    white-space: nowrap;
  }

  .hud .stat span {
    color: var(--accent-gold);
  }

  .hud .divider {
    width: 1px;
    height: 16px;
    background: var(--hairline);
  }

  .hud button {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 2px;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .hud button:hover {
    color: var(--star-white);
    border-bottom-color: var(--accent-rose);
  }

  @media (max-width: 560px) {
    .overlay { flex-direction: column; }
    .hud { align-self: flex-start; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div class="overlay">
  <div class="intro">
    <h1>Constellation Studio</h1>
    <p>Click anywhere to place a star. Press and drag from one star to another to connect them.</p>
  </div>

  <div class="hud">
    <div class="stat"><span id="starCount">0</span> stars</div>
    <div class="divider"></div>
    <div class="stat"><span id="linkCount">0</span> links</div>
    <div class="divider"></div>
    <button id="autoBtn">Auto-generate</button>
    <div class="divider"></div>
    <button id="clearBtn">Clear</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- state ----------
  let bgStars = [];
  let userStars = [];
  let connections = [];
  let shootingStars = [];
  let dragFromId = null;
  let dragPos = null;
  let nextId = 1;
  let mouseX = W / 2, mouseY = H / 2;

  function initBgStars() {
    bgStars = [];
    const count = Math.floor((W * H) / 9000);
    for (let i = 0; i < count; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        baseOpacity: Math.random() * 0.5 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.15 + 0.02,
        vx: (Math.random() - 0.5) * 0.04,
        vy: (Math.random() - 0.5) * 0.04
      });
    }
  }
  initBgStars();

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function findNearStar(x, y, radius) {
    let closest = null, closestD = radius;
    for (const s of userStars) {
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < closestD) { closest = s; closestD = d; }
    }
    return closest;
  }

  function addStar(x, y) {
    const star = { id: nextId++, x, y, born: performance.now(), pulse: Math.random() * Math.PI * 2 };
    userStars.push(star);
    updateStats();
    return star;
  }

  function addConnection(id1, id2) {
    if (id1 === id2) return;
    const exists = connections.some(c => (c[0] === id1 && c[1] === id2) || (c[0] === id2 && c[1] === id1));
    if (!exists) {
      connections.push([id1, id2, performance.now()]);
      updateStats();
    }
  }

  function clearAll() {
    userStars = [];
    connections = [];
    updateStats();
  }

  function updateStats() {
    document.getElementById('starCount').textContent = userStars.length;
    document.getElementById('linkCount').textContent = connections.length;
  }

  function spawnShootingStar() {
    const fromLeft = Math.random() > 0.5;
    const y0 = Math.random() * H * 0.5;
    const x0 = fromLeft ? -20 : W + 20;
    const angle = fromLeft ? (Math.random() * 0.3 + 0.15) : Math.PI - (Math.random() * 0.3 + 0.15);
    const speed = Math.random() * 4 + 6;
    shootingStars.push({
      x: x0, y: y0,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      trail: []
    });
  }
  setInterval(() => { if (Math.random() > 0.35) spawnShootingStar(); }, 3800);

  function autoGenerate() {
    clearAll();
    const cx = W / 2, cy = H / 2 - 20;
    const R = Math.min(W, H) * 0.22;
    const points = 7 + Math.floor(Math.random() * 3);
    const placed = [];
    for (let i = 0; i < points; i++) {
      const angle = (i / points) * Math.PI * 2 + Math.random() * 0.4;
      const radius = R * (0.55 + Math.random() * 0.55);
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius * 0.75;
      placed.push({ x, y });
    }
    placed.forEach((p, i) => {
      setTimeout(() => {
        const s = addStar(p.x, p.y);
        if (i > 0) addConnection(placed[i - 1].starId, s.id);
        placed[i].starId = s.id;
      }, i * 140);
    });
  }

  // ---------- pointer interaction ----------
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const pos = getPos(e);
    const near = findNearStar(pos.x, pos.y, 16);
    if (near) {
      dragFromId = near.id;
      dragPos = { x: pos.x, y: pos.y };
    } else {
      addStar(pos.x, pos.y);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pos = getPos(e);
    mouseX = pos.x; mouseY = pos.y;
    if (dragFromId !== null) dragPos = { x: pos.x, y: pos.y };
  });

  window.addEventListener('pointerup', (e) => {
    if (dragFromId !== null) {
      const pos = getPos(e);
      const near = findNearStar(pos.x, pos.y, 20);
      if (near && near.id !== dragFromId) addConnection(dragFromId, near.id);
      dragFromId = null;
      dragPos = null;
    }
  });

  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('autoBtn').addEventListener('click', autoGenerate);

  // ---------- render loop ----------
  function draw(now) {
    // background nebula wash
    const grad = ctx.createRadialGradient(
      W * 0.5 + (mouseX - W / 2) * 0.02, H * 0.4 + (mouseY - H / 2) * 0.02, 0,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.8
    );
    grad.addColorStop(0, '#181240');
    grad.addColorStop(0.5, '#100E28');
    grad.addColorStop(1, '#0A0A18');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // ambient background stars
    for (const s of bgStars) {
      s.x += s.vx; s.y += s.vy;
      if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
      if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;
      const twinkle = Math.sin(now * 0.001 * s.speed + s.phase) * 0.3 + 0.7;
      ctx.beginPath();
      ctx.fillStyle = `rgba(245,240,255,${s.baseOpacity * twinkle})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // shooting stars
    shootingStars = shootingStars.filter(m => m.life > 0);
    for (const m of shootingStars) {
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > 14) m.trail.shift();
      m.x += m.vx; m.y += m.vy;
      m.life -= 0.012;
      ctx.beginPath();
      for (let i = 0; i < m.trail.length; i++) {
        const p = m.trail[i];
        const alpha = (i / m.trail.length) * m.life;
        ctx.strokeStyle = `rgba(242,200,121,${alpha})`;
        ctx.lineWidth = 1.5;
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    // connections
    for (const [id1, id2, t] of connections) {
      const a = userStars.find(s => s.id === id1);
      const b = userStars.find(s => s.id === id2);
      if (!a || !b) continue;
      const age = Math.min((now - t) / 500, 1);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + (b.x - a.x) * age, a.y + (b.y - a.y) * age);
      ctx.strokeStyle = 'rgba(242,200,121,0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // drag preview
    if (dragFromId !== null && dragPos) {
      const a = userStars.find(s => s.id === dragFromId);
      if (a) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(dragPos.x, dragPos.y);
        ctx.strokeStyle = 'rgba(232,92,138,0.55)';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // user stars
    for (const s of userStars) {
      const age = Math.min((now - s.born) / 400, 1);
      const scale = 1 - Math.pow(1 - age, 3);
      const pulse = Math.sin(now * 0.002 + s.pulse) * 0.15 + 1;
      const r = 3.2 * scale * pulse;

      const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 6);
      glow.addColorStop(0, `rgba(245,240,255,${0.5 * scale})`);
      glow.addColorStop(1, 'rgba(245,240,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${scale})`;
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
